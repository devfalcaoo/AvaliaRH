<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvaliaRH — Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="icon" type="image/x-icon" href="../../assets/img/favicon/favicon.ico">

    <style>
        /* KPI cards */
        .kpi-card { background:linear-gradient(135deg,var(--azul-claro),#dce0ff); border:1.5px solid #c0c9ff; border-radius:14px; padding:1.1rem 1.3rem; display:flex; flex-direction:column; gap:.3rem; transition:transform .2s; }
        .kpi-card:hover { transform:translateY(-2px); }
        .kpi-label { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--suave); }
        .kpi-value { font-size:1.75rem; font-weight:800; color:var(--azul-escuro); }
        .kpi-value-sm { font-size:1.1rem; }

        /* Blocos dos gráficos */
        .dashboard-block { background:var(--fundo); border:1.5px solid var(--borda); border-radius:12px; padding:1rem 1.15rem; min-height:120px; }

        /* Barras */
        .bar-row { display:grid; grid-template-columns:150px 1fr 48px; gap:.5rem; align-items:center; margin-bottom:.65rem; font-size:.85rem; color:var(--texto); }
        .bar-row span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .bar-track { height:8px; background:var(--borda); border-radius:99px; overflow:hidden; }
        .bar-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--azul-medio),var(--roxo)); }

        /* Lista de avaliações */
        .lista-dash-item { display:flex; align-items:center; padding:.7rem 0; border-bottom:1px solid var(--borda); gap:1rem; font-size:.9rem; }
        .lista-dash-item:last-child { border-bottom:none; }
        .lista-dash-meta { color:var(--suave); font-size:.8rem; }
        .lista-dash-item > div:first-child { flex:1; }
        .btn-excluir-aval { background:none; border:1.5px solid #fca5a5; color:#dc2626; border-radius:8px; padding:.25rem .6rem; font-size:.78rem; cursor:pointer; transition:all .2s; flex-shrink:0; }
        .btn-excluir-aval:hover { background:#fee2e2; }

        .sem-dados { color:var(--suave); font-size:.9rem; font-style:italic; padding:.5rem 0; }

        /* Secção title igual ao index */
        .section-label { font-weight:700; color:var(--azul-medio); font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; margin-bottom:.65rem; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="avalia-header">
        <div class="header-inner">
            <img src="../../assets/img/logo-sem-fundo.png" alt="AvaliaRH" class="header-logo" onerror="this.style.display='none'">
            <div class="header-subtitle">Dashboard</div>

            <!-- Links de navegação -->
            <a href="../../../index.html" class="btn-dash ms-auto">
                <i class="bi bi-plus-lg"></i> Nova Avaliação
            </a>
            <a href="colaboradores.html" class="btn-dash ms-2">
                <i class="bi bi-people"></i> Colaboradores
            </a>

            <!-- Usuário logado -->
            <span id="usuarioHeader" style="font-size:.78rem;color:rgba(255,255,255,.7);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:.5rem"></span>

            <!-- Logout -->
            <button class="btn-avalia btn-avalia-ghost ms-2" style="font-size:.78rem;padding:.3rem .75rem;color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.25)" onclick="fazerLogout()">
                <i class="bi bi-box-arrow-right"></i> Sair
            </button>
        </div>
    </header>

    <main class="avalia-main">
        <div class="avalia-container">
            <div class="avalia-card">
                <section class="avalia-section">

                    <div class="section-title mb-4">📊 Visão Geral das Avaliações</div>

                    <!-- KPIs -->
                    <div class="row g-3 mb-4">
                        <div class="col-6 col-md-3">
                            <div class="kpi-card">
                                <span class="kpi-label">Total</span>
                                <span class="kpi-value" id="kpiTotal">—</span>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="kpi-card">
                                <span class="kpi-label">Média Geral</span>
                                <span class="kpi-value" id="kpiMedia">—</span>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="kpi-card">
                                <span class="kpi-label">Este Mês</span>
                                <span class="kpi-value" id="kpiMes">—</span>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="kpi-card">
                                <span class="kpi-label">Mais Frequente</span>
                                <span class="kpi-value kpi-value-sm" id="kpiResultado">—</span>
                            </div>
                        </div>
                    </div>

                    <!-- Gráficos -->
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <div class="section-label">Distribuição de Resultados</div>
                            <div id="distribuicao" class="dashboard-block"></div>
                        </div>
                        <div class="col-md-6">
                            <div class="section-label">Média por Competência</div>
                            <div id="mediaCompetencias" class="dashboard-block"></div>
                        </div>
                    </div>

                    <!-- Últimas avaliações -->
                    <div class="section-label">Últimas Avaliações</div>
                    <div id="ultimasAvaliacoes" class="dashboard-block"></div>

                </section>
            </div>
        </div>
    </main>

    <footer class="avalia-footer">
        AvaliaRH © 2026 — Sistema de Avaliação de Competências com Inteligência Artificial — Desenvolvido por Falcão
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/db.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/dashboard.js"></script>
    <script>
        // Protege a página e exibe o usuário logado
        (async () => {
            await protegerPagina();
            await exibirUsuarioHeader();
        })();
    </script>
</body>
</html>
