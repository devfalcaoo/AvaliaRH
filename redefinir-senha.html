<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvaliaRH — Redefinir Senha</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./frontend/components/style/style.css">
    <link rel="icon" type="image/x-icon" href="/frontend/assets/img/favicon/favicon.ico">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, var(--azul-escuro) 0%, #1e1060 50%, var(--roxo) 100%); }

        .login-card { background: #fff; border-radius: 20px; padding: 2.5rem 2.25rem; width: 100%; max-width: 420px; box-shadow: 0 24px 64px rgba(0,0,0,.25); animation: cardIn .4s cubic-bezier(.22,.61,.36,1) both; }
        @keyframes cardIn { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }

        .login-logo { text-align: center; margin-bottom: 1.75rem; }
        .login-logo img { height: 52px; }
        .login-logo .brand { font-size: 1.6rem; font-weight: 800; }
        .login-logo .brand span { color: var(--roxo); }

        .login-title { font-size: 1.1rem; font-weight: 700; color: var(--texto); margin-bottom: .5rem; text-align: center; }
        .login-subtitle { font-size: .85rem; color: var(--suave); margin-bottom: 1.5rem; text-align: center; }

        .form-group { margin-bottom: 1rem; }

        .login-footer { text-align: center; margin-top: 1.25rem; font-size: .82rem; color: var(--suave); }
        .login-footer a { color: var(--azul-medio); text-decoration: none; font-weight: 600; }
        .login-footer a:hover { text-decoration: underline; }

        .alert-msg { border-radius: 8px; padding: .65rem 1rem; font-size: .85rem; margin-bottom: 1rem; display: none; }
        .alert-erro { background: #fee2e2; border: 1px solid #fca5a5; color: #dc2626; }
        .alert-ok   { background: #dcfce7; border: 1px solid #86efac; color: #16a34a; }

        #estadoVerificando { text-align: center; color: var(--suave); font-size: .9rem; padding: 1rem 0; }
        #formRedefinir, #linkInvalido { display: none; }
    </style>
</head>
<body>

    <div class="login-card">

        <div class="login-logo">
            <img src="./frontend/assets/img/logo-fundo-branco.png" alt="AvaliaRH"
                 onerror="this.style.display='none';document.getElementById('brand-fb').style.display='block'">
            <div id="brand-fb" style="display:none" class="brand">Avalia<span>RH</span></div>
        </div>

        <div class="login-title">Criar nova senha</div>

        <!-- Estado 1: verificando o link do e-mail -->
        <div id="estadoVerificando">Verificando o link de recuperação...</div>

        <!-- Estado 2: link inválido/expirado -->
        <div id="linkInvalido">
            <div class="alert-msg alert-erro" style="display:block">
                Este link é inválido ou expirou. Solicite um novo link de recuperação.
            </div>
            <a class="btn-avalia btn-avalia-primary w-100 mt-1 justify-content-center" href="esqueci-senha.html">
                Solicitar novo link
            </a>
        </div>

        <!-- Estado 3: formulário de nova senha -->
        <div id="formRedefinir">
            <div class="login-subtitle">Defina uma nova senha para sua conta.</div>

            <div class="alert-msg alert-erro" id="erroNova"></div>
            <div class="alert-msg alert-ok"   id="okNova"></div>

            <div class="form-group">
                <label class="avalia-label">Nova senha</label>
                <input type="password" id="novaSenha" class="avalia-input" placeholder="Mínimo 6 caracteres">
            </div>

            <div class="form-group">
                <label class="avalia-label">Confirmar nova senha</label>
                <input type="password" id="novaSenha2" class="avalia-input" placeholder="Repita a nova senha">
            </div>

            <button class="btn-avalia btn-avalia-primary w-100 mt-1" onclick="salvarNovaSenha()" id="btnNova">
                Salvar nova senha
            </button>
        </div>

        <div class="login-footer">
            <a href="login.html">Voltar para o login</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./frontend/components/js/supabase.js"></script>
    <script>

        let sessaoValida = false;

        // O cliente Supabase detecta automaticamente o token de recuperação
        // presente na URL (enviado por e-mail) e dispara este evento.
        sb.auth.onAuthStateChange((event, session) => {
            if (event === "PASSWORD_RECOVERY" && session) {
                sessaoValida = true;
                mostrarFormulario();
            }
        });

        // Fallback: caso o evento já tenha disparado antes deste listener
        // ser registrado, verificamos diretamente se existe uma sessão ativa.
        (async () => {
            await new Promise(r => setTimeout(r, 400)); // dá tempo do evento PASSWORD_RECOVERY chegar
            if (sessaoValida) return;

            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                sessaoValida = true;
                mostrarFormulario();
            } else {
                mostrarLinkInvalido();
            }
        })();

        function mostrarFormulario() {
            document.getElementById("estadoVerificando").style.display = "none";
            document.getElementById("linkInvalido").style.display      = "none";
            document.getElementById("formRedefinir").style.display     = "block";
        }

        function mostrarLinkInvalido() {
            document.getElementById("estadoVerificando").style.display = "none";
            document.getElementById("formRedefinir").style.display     = "none";
            document.getElementById("linkInvalido").style.display      = "block";
        }

        function mostrarErroNova(msg) {
            const ok = document.getElementById("okNova");
            ok.style.display = "none";
            const el = document.getElementById("erroNova");
            el.textContent   = msg;
            el.style.display = "block";
        }

        async function salvarNovaSenha() {
            const senha  = document.getElementById("novaSenha").value;
            const senha2 = document.getElementById("novaSenha2").value;
            const erro   = document.getElementById("erroNova");
            const ok     = document.getElementById("okNova");
            const btn    = document.getElementById("btnNova");

            erro.style.display = ok.style.display = "none";

            if (!sessaoValida) {
                mostrarErroNova("Sessão de recuperação inválida. Solicite um novo link.");
                return;
            }
            if (!senha) { mostrarErroNova("Digite a nova senha."); return; }
            if (senha.length < 6) { mostrarErroNova("A senha precisa ter no mínimo 6 caracteres."); return; }
            if (senha !== senha2) { mostrarErroNova("As senhas não coincidem."); return; }

            btn.textContent = "Salvando...";
            btn.disabled    = true;

            const { error } = await sb.auth.updateUser({ password: senha });

            if (error) {
                mostrarErroNova("Erro ao redefinir senha: " + error.message);
                btn.textContent = "Salvar nova senha";
                btn.disabled    = false;
                return;
            }

            ok.textContent   = "Senha redefinida com sucesso! Redirecionando para o login...";
            ok.style.display = "block";
            btn.textContent  = "Senha salva ✓";

            // Encerra a sessão de recuperação para forçar novo login com a senha nova
            await sb.auth.signOut();
            setTimeout(() => window.location.href = "login.html", 2500);
        }

        document.addEventListener("keydown", e => { if (e.key === "Enter") salvarNovaSenha(); });

    </script>
</body>
</html>
