<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvaliaRH — Recuperar Senha</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./frontend/components/style/style.css">
    <link rel="icon" type="image/x-icon" href="/frontend/assets/img/favicon/favicon.ico">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, var(--azul-escuro) 0%, #1e1060 50%, var(--roxo) 100%); }

        .login-card { background: #fff; border-radius: 20px; padding: 2.5rem 2.25rem; width: 100%; max-width: 420px; box-shadow: 0 24px 64px rgba(0,0,0,.25); animation: cardIn .4s cubic-bezier(.22,.61,.36,1) both; }
        @keyframes cardIn { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }

        .login-logo { text-align: center; margin-bottom: 1.75rem; }
        .login-logo img { height: 52px; }
        .login-logo .brand { font-size: 1.6rem; font-weight: 800; }
        .login-logo .brand span { color: var(--roxo); }
        .login-logo p { color: var(--suave); font-size: .875rem; margin-top: .25rem; }

        .login-title { font-size: 1.1rem; font-weight: 700; color: var(--texto); margin-bottom: .5rem; text-align: center; }
        .login-subtitle { font-size: .85rem; color: var(--suave); margin-bottom: 1.5rem; text-align: center; }

        .form-group { margin-bottom: 1rem; }

        .login-footer { text-align: center; margin-top: 1.25rem; font-size: .82rem; color: var(--suave); }
        .login-footer a { color: var(--azul-medio); text-decoration: none; font-weight: 600; }
        .login-footer a:hover { text-decoration: underline; }

        .alert-msg { border-radius: 8px; padding: .65rem 1rem; font-size: .85rem; margin-bottom: 1rem; display: none; }
        .alert-erro { background: #fee2e2; border: 1px solid #fca5a5; color: #dc2626; }
        .alert-ok   { background: #dcfce7; border: 1px solid #86efac; color: #16a34a; }
    </style>
</head>
<body>

    <div class="login-card">

        <div class="login-logo">
            <img src="./frontend/assets/img/logo-fundo-branco.png" alt="AvaliaRH"
                 onerror="this.style.display='none';document.getElementById('brand-fb').style.display='block'">
            <div id="brand-fb" style="display:none" class="brand">Avalia<span>RH</span></div>
        </div>

        <div class="login-title">Recuperar senha</div>
        <div class="login-subtitle">Informe seu e-mail e enviaremos um link para redefinir sua senha.</div>

        <div class="alert-msg alert-erro" id="erroRec"></div>
        <div class="alert-msg alert-ok"   id="okRec"></div>

        <div class="form-group">
            <label class="avalia-label">E-mail</label>
            <input type="email" id="recEmail" class="avalia-input" placeholder="seu@email.com">
        </div>

        <button class="btn-avalia btn-avalia-primary w-100 mt-1" onclick="enviarRecuperacao()" id="btnRec">
            Enviar link de recuperação
        </button>

        <div class="login-footer">
            Lembrou a senha? <a href="login.html">Voltar para o login</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./frontend/components/js/supabase.js"></script>
    <script>

        function mostrarErroRec(msg) {
            const ok = document.getElementById("okRec");
            ok.style.display = "none";
            const el = document.getElementById("erroRec");
            el.textContent   = msg;
            el.style.display = "block";
        }

        async function enviarRecuperacao() {
            const email = document.getElementById("recEmail").value.trim();
            const erro  = document.getElementById("erroRec");
            const ok    = document.getElementById("okRec");
            const btn   = document.getElementById("btnRec");

            erro.style.display = ok.style.display = "none";

            if (!email) {
                mostrarErroRec("Informe seu e-mail.");
                return;
            }

            if (typeof sb === "undefined" || !sb?.auth) {
                mostrarErroRec("Supabase não carregou. Verifique o CDN e o arquivo supabase.js.");
                return;
            }

            btn.textContent = "Enviando...";
            btn.disabled    = true;

            const redirectTo = window.location.origin + window.location.pathname.replace("esqueci-senha.html", "redefinir-senha.html");

            const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });

            // Por segurança, sempre exibimos a mesma mensagem de sucesso,
            // mesmo que o e-mail não exista na base (evita enumeração de contas).
            if (error) {
                console.error(error);
            }

            ok.textContent   = "Se este e-mail estiver cadastrado, você receberá um link de recuperação em instantes.";
            ok.style.display = "block";
            btn.textContent  = "Link enviado ✓";
        }

        document.addEventListener("keydown", e => { if (e.key === "Enter") enviarRecuperacao(); });

    </script>
</body>
</html>
