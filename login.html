<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvaliaRH — Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./frontend/components/style/style.css">
    <link rel="icon" type="image/x-icon" href="/frontend/assets/img/favicon/favicon.ico">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, var(--azul-escuro) 0%, #1e1060 50%, var(--roxo) 100%); }

        .login-card { background: #fff; border-radius: 20px; padding: 2.5rem 2.25rem; width: 100%; max-width: 420px; box-shadow: 0 24px 64px rgba(0,0,0,.25); animation: cardIn .4s cubic-bezier(.22,.61,.36,1) both; }
        @keyframes cardIn { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }

        .login-logo { text-align: center; margin-bottom: 1.75rem; }
        .login-logo img { height: 52px; }
        .login-logo .brand { font-size: 1.6rem; font-weight: 800; }
        .login-logo .brand span { color: var(--roxo); }
        .login-logo p { color: var(--suave); font-size: .875rem; margin-top: .25rem; }

        .login-title { font-size: 1.1rem; font-weight: 700; color: var(--texto); margin-bottom: 1.5rem; text-align: center; }

        .avalia-label { display: block; font-size: .8rem; font-weight: 600; color: var(--suave); margin-bottom: .4rem; }
        .form-group { margin-bottom: 1rem; }

        .login-footer { text-align: center; margin-top: 1.25rem; font-size: .82rem; color: var(--suave); }
        .login-footer a { color: var(--azul-medio); text-decoration: none; font-weight: 600; }
        .login-footer a:hover { text-decoration: underline; }

        .alert-erro { background: #fee2e2; border: 1px solid #fca5a5; color: #dc2626; border-radius: 8px; padding: .65rem 1rem; font-size: .85rem; margin-bottom: 1rem; display: none; }

        .divider { display: flex; align-items: center; gap: .75rem; margin: 1.25rem 0; color: var(--suave); font-size: .8rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--borda); }
    </style>
</head>
<body>

    <div class="login-card">

        <div class="login-logo">
            <img src="./frontend/assets/img/logo-fundo-branco.png" alt="AvaliaRH"
                 onerror="this.style.display='none';document.getElementById('brand-fb').style.display='block'">
            <div id="brand-fb" style="display:none" class="brand">Avalia<span>RH</span></div>
            <p>Sistema de Avaliação de Competências</p>
        </div>

        <div class="login-title">Acesse sua conta</div>

        <div class="alert-erro" id="erroLogin"></div>

        <div class="form-group">
            <label class="avalia-label">E-mail</label>
            <input type="email" id="loginEmail" class="avalia-input" placeholder="seu@email.com">
        </div>

        <div class="form-group">
            <label class="avalia-label">Senha</label>
            <input type="password" id="loginSenha" class="avalia-input" placeholder="••••••••">
        </div>

        <button class="btn-avalia btn-avalia-primary w-100 mt-1" onclick="entrar()" id="btnEntrar">
            Entrar
        </button>

        <div class="divider">ou</div>

        <div class="login-footer">
            Não tem conta? <a href="registro.html">Criar conta</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./frontend/components/js/supabase.js"></script>
    <script src="./frontend/components/js/auth.js"></script>
    <script>

        // Se já estiver logado, ir direto para o sistema
        (async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) window.location.href = "index.html";
        })();

        async function entrar() {
            const email = document.getElementById("loginEmail").value.trim();
            const senha = document.getElementById("loginSenha").value;
            const erro  = document.getElementById("erroLogin");
            const btn   = document.getElementById("btnEntrar");

            erro.style.display = "none";

            if (!email || !senha) {
                erro.textContent    = "Preencha e-mail e senha.";
                erro.style.display  = "block";
                return;
            }

            if (typeof sb === "undefined" || !sb?.auth) {
                erro.textContent   = "Supabase não carregou. Verifique o CDN e o arquivo supabase.js.";
                erro.style.display = "block";
                return;
            }

            btn.textContent  = "Entrando...";
            btn.disabled     = true;

            try {
                await fazerLogin(email, senha);
                window.location.href = "index.html";
            } catch (e) {
                erro.textContent   = "E-mail ou senha incorretos.";
                erro.style.display = "block";
                btn.textContent    = "Entrar";
                btn.disabled       = false;
            }
        }

        // Login com Enter
        document.addEventListener("keydown", e => {
            if (e.key === "Enter") entrar();
        });

    </script>
</body>
</html>
